# Bouwt de Android-app (APK) van Face Anonymizer Camera en zet hem klaar als download:
# https://github.com/picazuid-pilot/face-anonymizer/releases/download/android/fa-camera.apk
name: Android-app bouwen

on:
  push:
    branches: [main]
    paths:
      - "camera/**"
      - "android-app/**"
      - "browser-extension/lib/**"
      - "browser-extension/models/**"
      - "browser-extension/src/yunet.js"
      - "assets/overlay.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web-app klaarzetten
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          bash build-www.sh
          npx cap sync android

      - name: Eigen sleutel gebruiken (als die in Secrets staat)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Eigen sleutel gebruikt"
          else
            echo "Geen eigen sleutel ingesteld: test-sleutel uit de repo gebruikt"
          fi

      - name: APK bouwen
        working-directory: android-app/android
        env:
          FA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PciBuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/fa-camera.apk"
          ls -la "$GITHUB_WORKSPACE/fa-camera.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fa-camera-apk
          path: fa-camera.apk

      - name: Klaarzetten als download (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="FA Camera voor Android, testbuild ${{ github.run_number }} (commit ${GITHUB_SHA::7}). Licentie: GPL-3.0-or-later.

          Installeren: open op je telefoon https://github.com/${{ github.repository }}/releases/download/android/fa-camera.apk en sta installeren toe. Uitleg: zie android-app/README.md."
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "FA Camera voor Android" --notes "$NOTES" --latest=false
          else
            gh release edit android --notes "$NOTES"
          fi
          gh release upload android fa-camera.apk --clobber
