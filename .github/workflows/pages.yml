# Zet de Foto Anonymizer-webtool online via GitHub Pages bij elke wijziging op main.
name: Webtool publiceren

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "browser-extension/lib/**"
      - "browser-extension/models/**"
      - "browser-extension/src/yunet.js"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Webtool bouwen
        run: bash web/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
