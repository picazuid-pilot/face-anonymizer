# Concept-bouwrecept voor F-Droid (hoort in https://gitlab.com/fdroid/fdroiddata,
# als metadata/io.github.picazuidpilot.facecamera.yml). Zie android-app/FDROID.md.
Categories:
  - Multimedia
  - Security
License: GPL-3.0-or-later
AuthorName: picazuid-pilot
WebSite: https://picazuid-pilot.github.io/face-anonymizer/camera/
SourceCode: https://github.com/picazuid-pilot/face-anonymizer
IssueTracker: https://github.com/picazuid-pilot/face-anonymizer/issues
Changelog: https://github.com/picazuid-pilot/face-anonymizer/blob/HEAD/CHANGELOG.md

AutoName: FA Camera

RepoType: git
Repo: https://github.com/picazuid-pilot/face-anonymizer.git

Builds:
  - versionName: 1.0.0
    versionCode: 100
    commit: v1.0.0
    subdir: android-app/android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    rm:
      - browser-extension/lib
      - android-app/sideload.keystore
    prebuild:
      - cd ../..
      - npm ci --no-audit --no-fund
      - bash build-www.sh
      - npx cap sync android
    scandelete:
      - android-app/node_modules
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 100
